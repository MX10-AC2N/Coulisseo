# Prévisualisation d'une pull request : le site est construit et déposé en artefact,
# téléchargeable depuis l'onglet « Actions » de la PR (sans rien publier).
name: Prévisualisation — pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apercu:
    name: Construire l'aperçu
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build
        env:
          # chemin relatif : l'aperçu fonctionne une fois décompressé n'importe où
          BASE_PATH: './'

      - name: Résumé de la PR
        run: |
          echo "### Aperçu de la pull request #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Le site construit est disponible en artefact ci-dessous." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branche : \`${{ github.head_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Déposer l'aperçu (artefact)
        uses: actions/upload-artifact@v7
        with:
          name: coulisseo-apercu-pr-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 14
          if-no-files-found: error
