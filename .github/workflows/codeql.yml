# Analyse de sécurité du code JavaScript/TypeScript (dépendances, injections, etc.).
name: Sécurité — CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 1 * *' # le 1er de chaque mois
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Construire
        run: npm run build
        env:
          BASE_PATH: './'

      - name: Analyser
        uses: github/codeql-action/analyze@v4
